[package]
name = "fgate"
version = "0.5.0"
edition = "2024"
rust-version = "1.87"
description = "The fair gate: coding agents sharing one machine take turns for builds, within CPU and memory ceilings"
license = "MIT"
repository = "https://github.com/alexander-frase/fgate"
readme = "README.md"
keywords = ["build", "agents", "cargo", "queue", "claude-code"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/", "examples/", "ci/", ".github/"]

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
